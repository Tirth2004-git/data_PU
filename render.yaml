services:
  - type: web
    name: campus-compass-portal
    runtime: node
    plan: free
    buildCommand: npm install --prefix server && npm install --prefix client && npm run build --prefix client
    startCommand: npm start --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: SITE_PIN_HASH
        sync: false
      - key: SITE_ACCESS_TOKEN_SECRET
        generateValue: true
      - key: ALERT_EMAIL_TO
        sync: false
      - key: CLIENT_URL
        value: https://campus-compass-portal.onrender.com